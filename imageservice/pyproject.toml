[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imageservice"
version = "0.1.0"
description = "Toliman image acquisition service"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "netCDF4",
]

[project.optional-dependencies]
test = [
    "pytest>=9",
    "pytest-benchmark>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["test_*.py"]
python_classes= ["Test*"]
python_functions = ["test_*"]

# Markers
markers = [
    "unit:        fast, isolated, no hardware",
    "integration: multiple modules working together, no hardware",
    "e2e:         full simulated session, no hardware",
    "benchmark:   performance tests (run with pytest-benchmark)",
    "slow:        tests that take > 1s",
    "hardware:    requires real Ximea camera (skipped in CI)",
]

# Default: run unit and integration, skip slow and hardware
addopts = "-v -m 'not hardware and not slow'"

# ---------------------------------------------------------------------------
# pytest-benchmark configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options.benchmark]
# Benchmarks live in tests/benchmarks/ and are only run when explicitly
# requested: pytest tests/benchmarks/ --benchmark-enable
disable_gc   = true
min_rounds   = 100
warmup       = true
warmup_iterations = 10
